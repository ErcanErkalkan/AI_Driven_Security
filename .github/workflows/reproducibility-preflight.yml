name: Reproducibility Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reproducibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download the cited CICIDS2017 working sample
        run: |
          mkdir -p data
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/Western-OC2-Lab/Intrusion-Detection-System-Using-Machine-Learning/main/data/CICIDS2017_sample.csv" \
            -o data/CICIDS2017_sample.csv

      - name: Verify working-sample integrity
        run: |
          test "$(stat -c%s data/CICIDS2017_sample.csv)" = "19868205"
          echo "03ba3626a0f9bb73b90c56772893e68b0577285130891cd7d811542c17b032dd  data/CICIDS2017_sample.csv" | sha256sum -c -

      - name: Run deterministic preprocessing and split preflight
        run: |
          python scripts/reproduce_protocol.py \
            --input data/CICIDS2017_sample.csv \
            --label Label \
            --output-dir preflight_outputs \
            --preflight-only

      - name: Assert published preflight invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("preflight_outputs/preflight.json").read_text(encoding="utf-8"))
          expected = {
              "n_rows_loaded": 56661,
              "n_rows_used": 44063,
              "exact_duplicate_rows_removed": 12598,
              "raw_feature_count": 77,
              "features_after_cleaning": 69,
              "train_rows": 33047,
              "test_rows": 11016,
              "train_test_exact_feature_overlap_rows": 0,
              "split_method": "stratified_group_kfold_holdout_4_folds",
          }

          mismatches = {
              key: {"expected": value, "actual": report.get(key)}
              for key, value in expected.items()
              if report.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"Preflight invariant mismatch: {mismatches}")

          print("All published preflight invariants matched.")
          PY

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-preflight
          path: preflight_outputs/
          if-no-files-found: error
